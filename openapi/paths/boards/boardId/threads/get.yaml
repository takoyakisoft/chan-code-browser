summary: List threads in a board
description: Retrieves a list of threads for a specified board.
operationId: listThreadsInBoard
tags:
  - Threads
parameters:
  - name: boardId
    in: path
    required: true
    description: The ID of the board to retrieve threads from.
    schema:
      type: string
      example: 'newsplus'
  - name: limit
    in: query
    description: Maximum number of threads to return.
    required: false
    schema:
      type: integer
      format: int32
      default: 50
  - name: offset
    in: query
    description: Number of threads to skip for pagination.
    required: false
    schema:
      type: integer
      format: int32
      default: 0
responses:
  '200':
    description: A list of threads for the specified board.
    content:
      application/json:
        schema:
          type: object
          properties:
            paging:
              $ref: '../../../../components/schemas/Paging.yaml' # Corrected path
            results:
              type: array
              items:
                $ref: '../../../../components/schemas/Thread.yaml' # Corrected path
  '404':
    description: Board not found.
    content:
      application/json:
        schema:
          $ref: '../../../../components/schemas/error.yaml' # Corrected path
  default:
    description: Unexpected error
    content:
      application/json:
        schema:
          $ref: '../../../../components/schemas/error.yaml' # Corrected path
