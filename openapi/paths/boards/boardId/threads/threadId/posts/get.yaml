summary: List posts in a thread
description: Retrieves a list of posts for a specified thread on a board.
operationId: listPostsInThread
tags:
  - Posts
parameters:
  - name: boardId
    in: path
    required: true
    description: The ID of the board.
    schema:
      type: string
      example: 'newsplus'
  - name: threadId
    in: path
    required: true
    description: The ID of the thread.
    schema:
      type: string
      example: '1609459200'
  - name: limit
    in: query
    description: Maximum number of posts to return.
    required: false
    schema:
      type: integer
      format: int32
      default: 100
  - name: offset
    in: query
    description: Number of posts to skip for pagination.
    required: false
    schema:
      type: integer
      format: int32
      default: 0
responses:
  '200':
    description: A list of posts for the specified thread.
    content:
      application/json:
        schema:
          type: object
          properties:
            paging:
              $ref: '../../../../../../components/schemas/Paging.yaml' # Corrected path
            results:
              type: array
              items:
                $ref: '../../../../../../components/schemas/Post.yaml' # Corrected path
  '404':
    description: Board or Thread not found.
    content:
      application/json:
        schema:
          $ref: '../../../../../../components/schemas/error.yaml' # Corrected path
  default:
    description: Unexpected error
    content:
      application/json:
        schema:
          $ref: '../../../../../../components/schemas/error.yaml' # Corrected path
