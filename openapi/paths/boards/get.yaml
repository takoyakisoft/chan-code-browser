summary: List all boards
description: Retrieves a list of all available message boards.
operationId: listBoards
tags:
  - Boards
parameters:
  - name: limit
    in: query
    description: Maximum number of boards to return.
    required: false
    schema:
      type: integer
      format: int32
      default: 100
  - name: offset
    in: query
    description: Number of boards to skip for pagination.
    required: false
    schema:
      type: integer
      format: int32
      default: 0
responses:
  '200':
    description: A list of boards.
    content:
      application/json:
        schema:
          type: object
          properties:
            paging:
              $ref: '../../components/schemas/Paging.yaml'
            results:
              type: array
              items:
                $ref: '../../components/schemas/Board.yaml'
  default:
    description: Unexpected error
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/error.yaml'
